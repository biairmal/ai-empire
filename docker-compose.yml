services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-empire}
      POSTGRES_DB: ${POSTGRES_DB:-empire}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: `docker compose run --rm migrate` (see Makefile)
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-empire}:${POSTGRES_PASSWORD:-empire}@postgres:5432/${POSTGRES_DB:-empire}?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
