name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: empire
          POSTGRES_PASSWORD: empire
          POSTGRES_DB: empire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U empire" --health-interval 2s --health-retries 15
    env:
      EMPIRE_TEST_DATABASE_URL: postgres://empire:empire@localhost:5432/empire_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: go vet ./...
      - run: go test ./...
      - name: Validate knowledge documents
        run: go run ./cmd/empire docs validate -local
