type: adr
title: Architecture Decision Record
id_prefix: ADR
question: Why did we choose this solution?
audience: Engineers, architects, future maintainers, client technical stakeholders
scopes: [project, client, stack, global]
folder: decisions
approval: required
required_metadata: [owner]
required_sections:
  - Context and Problem Statement
  - Decision Drivers
  - Considered Options
  - Decision Outcome
  - Consequences
